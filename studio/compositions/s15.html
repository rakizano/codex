    (function () {
      const CFG = {"fonts": ["Anton", "Bebas Neue", "Permanent Marker", "Special Elite", "Caveat Brush", "Russo One", "VT323", "Cinzel", "Tinos", "Archivo Black"], "id": "s15", "dur": 3.011, "t0": 34.1, "text": null, "params": {}, "camera": null, "tin": {"kind": "particles", "color": "#ffffff", "delay": 0.35, "dur": 0.7}, "tout": {"kind": "rotate", "angle": 90, "dur": 0.45}};
      HFS.boot('s15', CFG, (sc, ctx) => {

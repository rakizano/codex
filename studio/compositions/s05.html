      const CFG = {"fonts": ["Anton", "Bebas Neue", "Permanent Marker", "Special Elite", "Caveat Brush", "Russo One", "VT323", "Cinzel", "Tinos", "Archivo Black"], "id": "s05", "dur": 2.638, "t0": 8.722, "text": {"font": "Bebas Neue", "color": "#ffffff", "accent": "#3ff0ff", "pos": "upper", "text": "C'est bloqué? / Ah bon? Bah / j'vais / bicrave dans / l'escalier", "words": [9.16, 9.5, 9.62, 9.98, 10.22, 10.34, 10.44, 10.56, 10.66], "important": "Bah", "impact": 10.286, "preset": "stackPile", "intensity": 0.93, "why": "les mots s'empilent comme des marches", "align": "center", "outAt": 10.89}, "params": {}, "camera": null, "tin": {"kind": "zoomOut", "from": 0.4, "delay": 0.34, "dur": 0.6}, "tout": {"kind": "flash", "color": "#ffffff", "dur": 0.3}};

        X.update(t => { const k = t / sc.dur, i = 4 + k * 22, a = i * .38; hero.position.set(Math.cos(a) * 1.9, i * .22 + .1, Math.sin(a) * 1.9); hero.rotation.y = -a - Math.PI / 2; hero.pose({ walk: t * 8, amt: 1, lean: .12 });

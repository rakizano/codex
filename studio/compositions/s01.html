<template>
  <style>@font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-400.ttf'); font-display: block; }
    @font-face { font-family: 'Bebas Neue'; src: url('assets/fonts/BebasNeue-400.ttf'); font-display: block; }
    @font-face { font-family: 'Permanent Marker'; src: url('assets/fonts/PermanentMarker-400.ttf'); font-display: block; }
    @font-face { font-family: 'Special Elite'; src: url('assets/fonts/SpecialElite-400.ttf'); font-display: block; }
    @font-face { font-family: 'Caveat Brush'; src: url('assets/fonts/CaveatBrush-400.ttf'); font-display: block; }
    @font-face { font-family: 'Russo One'; src: url('assets/fonts/RussoOne-400.ttf'); font-display: block; }
    @font-face { font-family: 'VT323'; src: url('assets/fonts/VT323-400.ttf'); font-display: block; }
    @font-face { font-family: 'Cinzel'; src: url('assets/fonts/Cinzel-400.ttf'); font-display: block; }
    @font-face { font-family: 'Tinos'; src: url('assets/fonts/Tinos-700.ttf'); font-display: block; }
    @font-face { font-family: 'Archivo Black'; src: url('assets/fonts/ArchivoBlack-400.ttf'); font-display: block; }
    
    #root { position: absolute; inset: 0; overflow: hidden; background: #0b0a10; }
    #s01-stage, #s01-stage .lay { position: absolute; inset: 0; }
    #s01-stage svg { overflow: visible; }
    #s01-gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="s01" data-width="1080" data-height="1920">
    <div id="s01-stage">
      <canvas id="s01-gl" width="1080" height="1920"></canvas>
      <canvas id="s01-dust" class="lay" width="1080" height="1920"></canvas>
      <div id="s01-txt"></div>
    </div>
  </div>
  <script>
    /* SceneTemplate « luxe_window » — 3D : vitrine de luxe la nuit, trois lettres (les mots désirés) en relief chromé tournent sur des socles, projecteurs, reflets de vitre ; la caméra glisse le long de la vitrine. */
    (function () {
      const CFG = {"fonts": ["Anton", "Bebas Neue", "Permanent Marker", "Special Elite", "Caveat Brush", "Russo One", "VT323", "Cinzel", "Tinos", "Archivo Black"], "id": "s01", "dur": 2.68, "t0": 0.0, "text": {"font": "Bebas Neue", "color": "#ffffff", "accent": "#e9b949", "pos": "top", "text": "J'veux du L, / j'veux du V, / j'veux du G", "words": [0.0, 0.0, 0.34, 0.58, 0.78, 0.78, 0.96, 1.2, 1.32], "important": "veux", "impact": 1.01, "preset": "rebuild", "intensity": 1.01, "why": "les lettres désirées se reconstruisent comme des logos", "outAt": 2.06}, "params": {}, "camera": null, "tin": null, "tout": {"kind": "zoomThrough", "to": 16, "dur": 0.6}};
      HFS.boot('s01', CFG, (sc, ctx) => {
        const P = ctx.P, sv = HFS.svg, m = HFS.m, E = HFS.ease;

        const X = HFS.three(sc, document.getElementById('s01-gl'), { bg: 0x0b0a10, fog: [0x0b0a10, 8, 30], exposure: 1.2 }), T = X.T, K = HFS.K3;
        X.add(new T.HemisphereLight(0x40384f, 0x000000, .5));
        const floor = new T.Mesh(new T.PlaneGeometry(40, 40), new T.MeshStandardMaterial({ color: 0x1a1720, roughness: .15, metalness: .8 })); floor.rotation.x = -Math.PI / 2; X.add(floor);
        const wall = new T.Mesh(new T.PlaneGeometry(40, 20), new T.MeshStandardMaterial({ color: 0x2a2230, roughness: .9 })); wall.position.set(0, 10, -4); X.add(wall);
        const letters = (P.letters || 'L V G').split(' ').filter(Boolean), items = [];
        letters.forEach((ch, i) => { const x = (i - (letters.length - 1) / 2) * 2.4;
          const ped = new T.Mesh(new T.CylinderGeometry(.75, .85, 1.2, 40), new T.MeshStandardMaterial({ color: 0xf2efe8, roughness: .4 })); ped.position.set(x, .6, 0); ped.castShadow = ped.receiveShadow = true; X.add(ped);
          const t3 = K.text3D(T, ch, { size: 1.3, depth: .4, color: i % 2 ? 0xd9b34a : 0xe8e8ee, side: 0x5a4a30, metalness: .9, roughness: .2 }); t3.position.set(x, 1.25, 0); X.add(t3); items.push(t3);
          const v = K.volumetric(T, { color: 0xfff2d8, length: 7, radius: 1.1, intensity: .45, power: 4 }); v.position.set(x, 7.4, 0); X.add(v); });
        const glass = new T.Mesh(new T.PlaneGeometry(14, 9), new T.MeshStandardMaterial({ color: 0x8fb0ff, transparent: true, opacity: .07, roughness: 0, metalness: 1 })); glass.position.set(0, 4, 3.2); X.add(glass);
        X.update(t => items.forEach((it, i) => { const k = E.outBack(m.clamp((t - .15 - i * .35) / .5)); it.scale.setScalar(Math.max(.01, k)); it.rotation.y = t * 1.2 + i; it.position.y = 1.25 + sc.beat(t, 'kicks', 9) * .15; }));
        X.camMove('truck', { from: [-4.5, 3.2, 14], to: [4.5, 3.4, 12.5], target: t => new T.Vector3(-1 + t * .8, 1.8, 0), fov0: 42, fov1: 36, ease: 'inOut' });
        const dust = HFS.fx.particles(ctx.layer('dust'), { n: 60, colors: ['#fff2d8'], seed: 3, size: 3 }); sc.update(t => dust(t));
      });
    })();
  </script>
</template>

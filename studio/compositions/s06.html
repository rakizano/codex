<template>
  <style>@font-face { font-family: 'Anton'; src: url('assets/fonts/Anton-400.ttf'); font-display: block; }
    @font-face { font-family: 'Bebas Neue'; src: url('assets/fonts/BebasNeue-400.ttf'); font-display: block; }
    @font-face { font-family: 'Permanent Marker'; src: url('assets/fonts/PermanentMarker-400.ttf'); font-display: block; }
    @font-face { font-family: 'Special Elite'; src: url('assets/fonts/SpecialElite-400.ttf'); font-display: block; }
    @font-face { font-family: 'Caveat Brush'; src: url('assets/fonts/CaveatBrush-400.ttf'); font-display: block; }
    @font-face { font-family: 'Russo One'; src: url('assets/fonts/RussoOne-400.ttf'); font-display: block; }
    @font-face { font-family: 'VT323'; src: url('assets/fonts/VT323-400.ttf'); font-display: block; }
    @font-face { font-family: 'Cinzel'; src: url('assets/fonts/Cinzel-400.ttf'); font-display: block; }
    @font-face { font-family: 'Tinos'; src: url('assets/fonts/Tinos-700.ttf'); font-display: block; }
    @font-face { font-family: 'Archivo Black'; src: url('assets/fonts/ArchivoBlack-400.ttf'); font-display: block; }
    
    #root { position: absolute; inset: 0; overflow: hidden; background: #05060c; }
    #s06-stage, #s06-stage .lay { position: absolute; inset: 0; }
    #s06-stage svg { overflow: visible; }
    #s06-gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    #s06-grain { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }
  </style>
  <div id="root" data-composition-id="s06" data-width="1080" data-height="1920">
    <div id="s06-stage">
      <canvas id="s06-gl" width="1080" height="1920"></canvas>
      <div id="s06-grain"></div>
      <div id="s06-txt"></div>
    </div>
  </div>
  <script>
    /* SceneTemplate « city3d » — 3D : une foule grise parfaitement alignée (« intégrée ») ; le héros lumineux
       la traverse à contre-sens, se retourne ; lampadaires volumétriques, brouillard, caméra en orbite + dolly. */
    (function () {
      const CFG = {"fonts": ["Anton", "Bebas Neue", "Permanent Marker", "Special Elite", "Caveat Brush", "Russo One", "VT323", "Cinzel", "Tinos", "Archivo Black"], "id": "s06", "dur": 3.461, "t0": 11.06, "text": null, "params": {}, "camera": null, "tin": {"kind": "flash", "color": "#ffffff", "delay": 0.15, "dur": 0.3}, "tout": {"kind": "zoomThrough", "to": 10, "dur": 0.55}};
      HFS.boot('s06', CFG, (sc, ctx) => {
        const P = ctx.P, accent = parseInt((P.accent || '#ffd27a').replace('#', ''), 16);
        const X = HFS.three(sc, document.getElementById('s06-gl'), { bg: 0x05060c, fog: [0x05060c, 8, 38], exposure: 1.15 });
        const T = X.T, K = HFS.K3;
        const floor = new T.Mesh(new T.PlaneGeometry(80, 120), new T.MeshStandardMaterial({ color: 0x0d0e14, roughness: .3, metalness: .55 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; X.add(floor);
        X.add(new T.HemisphereLight(0x2a3354, 0x000000, .35), K.backdrop(T, { color: '#24305a', rim: 0x8fa8ff, rimPower: 1.5 }));
        for (let z = -2; z > -40; z -= 6) [-1, 1].forEach(sg => { const l = K.streetLight(T, { dir: -sg, light: z > -14 }); l.position.set(sg * 5.5, 0, z); X.add(l); });
        const crowd = [], r = HFS.m.rng('s06');
        for (let row = 0; row < 6; row++) for (let col = -3; col <= 3; col++) { if (col === 0) continue; const h = K.human(T, { color: 0x26272e, roughness: .8 }); h.position.set(col * 1.05, 0, -1 - row * 1.5); h.userData.ph = r() * 9; X.add(h); crowd.push(h); }
        const hero = K.human(T, { color: 0xffffff, emissive: accent, emissiveIntensity: 1.3, roughness: .3 }); X.add(hero);
        const glow = new T.PointLight(accent, 2.2, 5, 2); glow.position.y = 1.2; hero.add(glow);
        const spot = K.volumetric(T, { color: accent, length: 9, radius: 1.8, intensity: .5, power: 4 }); X.add(spot);
        const D = sc.dur, heroZ = t => -9 + Math.min(1, t / (D * .7)) * 8.5;
        X.update(t => {
          const z = heroZ(t), walking = t < D * .7, turn = HFS.m.clamp((t - D * .72) / .45);
          hero.position.set(0, 0, z);
          hero.pose({ walk: t * 7, amt: walking ? 1 : 0, yaw: Math.PI * turn, headYaw: walking ? Math.sin(t * 2) * .25 : 0 });
          spot.position.set(0, 9, z);
          crowd.forEach((h, i) => h.pose({ yaw: Math.PI, headYaw: HFS.m.clamp((t - .4 - (i % 5) * .1) / .6) * (h.position.x > 0 ? -.7 : .7) * (Math.abs(h.position.z - z) < 3 ? 1 : .3), lean: Math.sin(t * 1.2 + h.userData.ph) * .015 }));
        });
        X.camMove('orbit', { center: [0, 1.1, -3], a0: -.55, a1: .35, r: t => 9 - t * .9, y: t => 1.4 + t * .25, target: t => new T.Vector3(0, 1.2, heroZ(t)), fov0: 44, fov1: 36 });
      });
    })();
  </script>
</template>

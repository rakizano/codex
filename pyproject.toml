[project]
name = "memecoin-paper-bot"
version = "0.2.0"
description = "Audit défensif et paper-trading de meme coins Solana (aucune signature)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
live = ["solders>=0.21"]
dev = ["pytest>=8", "solders>=0.21"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
